    <!-- ===== JAVASCRIPT – COUNTDOWN LOGIC ===== -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ── CONFIG ──
            const AUTO_REDIRECT_ENABLED = false; // set true to redirect after countdown
            const REDIRECT_URL = 'https://t.me/+xfzi_3okr8Y0ZmVl';
            const COUNTDOWN_SECONDS = 5; // countdown from 5 seconds

            // ── DOM REFS ──
            const dEl = document.getElementById('d');
            const hEl = document.getElementById('h');
            const mEl = document.getElementById('m');
            const sEl = document.getElementById('s');

            let timerInterval = null;
            let remaining = COUNTDOWN_SECONDS;

            // ── HELPERS ──
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function updateDisplay(secs) {
                // For this demo, we only show seconds changing.
                // Days, Hours, Minutes stay "00" unless you extend the logic.
                // If you want a full countdown from e.g. 7 days, you'd need a target date.
                // This keeps it simple: just seconds countdown.
                dEl.textContent = '00';
                hEl.textContent = '00';
                mEl.textContent = '00';
                sEl.textContent = pad(secs);
            }

            function resetDisplay() {
                dEl.textContent = '00';
                hEl.textContent = '00';
                mEl.textContent = '00';
                sEl.textContent = '00';
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function startCountdown() {
                stopTimer();
                remaining = COUNTDOWN_SECONDS;
                updateDisplay(remaining);

                timerInterval = setInterval(function() {
                    remaining -= 1;

                    if (remaining <= 0) {
                        remaining = 0;
                        updateDisplay(remaining);
                        stopTimer();

                        if (AUTO_REDIRECT_ENABLED) {
                            window.location.href = REDIRECT_URL;
                        }
                        return;
                    }

                    updateDisplay(remaining);
                }, 1000);
            }

            // ── INIT ──
            if (AUTO_REDIRECT_ENABLED) {
                startCountdown();
            } else {
                resetDisplay();
            }

            // ── EXPOSE FOR DEBUG (optional) ──
            window.__countdown = {
                start: startCountdown,
                stop: stopTimer,
                reset: resetDisplay,
                setRemaining: function(secs) {
                    remaining = Math.max(0, secs);
                    updateDisplay(remaining);
                }
            };

        })();
    </script>
