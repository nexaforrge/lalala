<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="RAMxYAARWIN – #1 Telegram Hub" />
    <meta property="og:description" content="Join the most trusted prediction channel — real-time signals, AI-powered insight, one squad." />
    <meta property="og:image" content="divagamer.jpg" />
    <meta property="og:url" content="https://rawats7.github.io/divagame.org/" />
    <meta property="og:type" content="website" />
    <meta name="description" content="RAMxYAARWIN — the #1 Telegram hub for crypto signals, AI alerts, and a next-gen community." />
    <title>RAMxYAARWIN – #1 Telegram Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: rgba(139,92,246,0.35) transparent; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.35); border-radius: 10px; }

        :root {
            --bg: #030014;
            --violet: #8b5cf6;
            --cyan: #22d3ee;
            --magenta: #ec4899;
            --ink: #f1eefc;
            --muted: rgba(241,238,252,0.55);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #particleCanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.85; }

        .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg-canvas .grid {
            position: absolute; inset: -40px;
            background-image: linear-gradient(rgba(139,92,246,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.05) 1px, transparent 1px);
            background-size: 46px 46px; animation: gridShift 26s linear infinite;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 70%);
        }
        @keyframes gridShift { 0% { transform: translate(0,0); } 100% { transform: translate(46px,46px); } }
        .bg-canvas .orb { position: absolute; border-radius: 50%; filter: blur(150px); opacity: 0.32; animation: orbFloat 16s ease-in-out infinite alternate; }
        .bg-canvas .orb:nth-child(2) { width: 700px; height: 700px; background: var(--violet); top: -25%; left: -15%; }
        .bg-canvas .orb:nth-child(3) { width: 560px; height: 560px; background: var(--cyan); bottom: -25%; right: -12%; animation-delay: -5s; }
        .bg-canvas .orb:nth-child(4) { width: 420px; height: 420px; background: var(--magenta); top: 55%; left: 55%; transform: translate(-50%,-50%); animation-delay: -9s; opacity: 0.24; }
        @keyframes orbFloat { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,70px) scale(0.9); } 100% { transform: translate(50px,40px) scale(0.95); } }

        /* ─── OUTER WRAPPER ─── */
        .hero-outer {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            z-index: 10;
        }

        /* ─── THE BOX ─── */
        .hero {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 26px;
            padding: 40px 24px;
            position: relative;
            border-radius: 28px;
            border: 1px solid rgba(139,92,246,0.18);
            background: rgba(255,255,255,0.015);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 0 90px rgba(139,92,246,0.1), 0 30px 80px rgba(0,0,0,0.55);
            overflow: hidden;
        }

        @media (max-width: 640px) {
            .hero-outer { padding: 0; }
            .hero { max-width: 100%; width: 100vw; min-height: 100vh; border-radius: 0; border: none; }
        }

        /* 1. Profile photo */
        .profile-avatar-wrapper { position: relative; width: 150px; height: 150px; }
        .orbit-ring { position: absolute; inset: -18px; border-radius: 50%; border: 2px solid rgba(34,211,238,0.22); animation: ringSpin 9s linear infinite; }
        .orbit-ring:nth-child(2) { inset: -30px; border-color: rgba(236,72,153,0.22); animation-direction: reverse; animation-duration: 13s; border-style: dashed; }
        .orbit-ring:nth-child(3) { inset: -8px; border-color: rgba(139,92,246,0.35); animation-duration: 5s; border-width: 1px; }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        .profile-photo {
            position: absolute; inset: 0; border-radius: 50%; overflow: hidden; z-index: 2;
            box-shadow: 0 0 60px rgba(139,92,246,0.45), 0 0 22px rgba(34,211,238,0.3);
            animation: glowPulse 3s ease-in-out infinite;
        }
        .profile-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @keyframes glowPulse { 0%,100% { box-shadow: 0 0 40px rgba(139,92,246,0.4), 0 0 16px rgba(34,211,238,0.3); } 50% { box-shadow: 0 0 82px rgba(139,92,246,0.7), 0 0 32px rgba(236,72,153,0.45); } }
        .avatar-particle { position: absolute; width: 4px; height: 4px; background: var(--cyan); border-radius: 50%; animation: floatAround 6s ease-in-out infinite; }
        .avatar-particle:nth-child(4) { top: -10px; left: 30%; background: var(--magenta); }
        .avatar-particle:nth-child(5) { top: 80%; left: 70%; animation-delay: -2s; background: var(--violet); }
        .avatar-particle:nth-child(6) { top: 10%; right: 10%; animation-delay: -4s; background: var(--cyan); }
        @keyframes floatAround { 0%,100% { transform: translate(0,0) scale(1); opacity: 0.8; } 50% { transform: translate(0,-25px) scale(1); opacity: 0.5; } }

        /* 2. Channel name — signature duo-name treatment: RAM x YAARWIN */
        .channel-name {
            font-family: 'Rajdhani', 'Inter', sans-serif;
            font-size: clamp(2.1rem, 9vw, 3.1rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.16em;
            flex-wrap: wrap;
        }
        .channel-name .half-a {
            background: linear-gradient(120deg, #22d3ee, #8b5cf6);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 26px rgba(34,211,238,0.4));
            animation: glitchA 6s ease-in-out infinite;
        }
        .channel-name .half-b {
            background: linear-gradient(120deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 26px rgba(236,72,153,0.4));
            animation: glitchB 6s ease-in-out infinite;
        }
        .channel-name .join-x {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-size: 0.5em;
            color: var(--cyan);
            opacity: 0.85;
            position: relative;
            top: -0.05em;
            text-shadow: 0 0 14px rgba(34,211,238,0.6);
        }
        @keyframes glitchA {
            0%, 92%, 100% { transform: translate(0,0); opacity: 1; }
            93% { transform: translate(-2px,1px); opacity: 0.85; }
            95% { transform: translate(2px,-1px); opacity: 0.9; }
        }
        @keyframes glitchB {
            0%, 90%, 100% { transform: translate(0,0); opacity: 1; }
            91% { transform: translate(2px,-1px); opacity: 0.85; }
            94% { transform: translate(-2px,1px); opacity: 0.9; }
        }

        /* 3. Button */
        .btn-primary-wrapper { position: relative; display: inline-block; }
        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center; gap: 14px;
            background: linear-gradient(135deg, #22d3ee, #8b5cf6 55%, #ec4899);
            color: #05030f; font-weight: 700; font-size: 1.25rem;
            font-family: 'Rajdhani', 'Inter', sans-serif;
            letter-spacing: 0.2px;
            padding: 20px 56px; border-radius: 16px; text-decoration: none; border: none; cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25,0.8,0.25,1.2);
            box-shadow: 0 0 70px rgba(139,92,246,0.4), 0 12px 40px rgba(0,0,0,0.5);
            position: relative; overflow: hidden; isolation: isolate; white-space: nowrap;
        }
        .btn-primary:hover { transform: translateY(-6px) scale(1.04); box-shadow: 0 0 100px rgba(34,211,238,0.5), 0 18px 56px rgba(0,0,0,0.6); }
        .btn-primary:active { transform: translateY(-2px) scale(0.97); }
        .btn-primary i.fa-arrow-right { transition: transform 0.35s ease; }
        .btn-primary:hover i.fa-arrow-right { transform: translateX(10px); }
        .pulse-ring { position: absolute; inset: -10px; border-radius: 22px; border: 2.5px solid rgba(34,211,238,0.5); animation: pulseRing 2.5s ease-out infinite; pointer-events: none; }
        .pulse-ring:nth-child(2) { animation-delay: 0.8s; border-color: rgba(139,92,246,0.45); }
        .pulse-ring:nth-child(3) { animation-delay: 1.6s; border-color: rgba(236,72,153,0.35); }
        @keyframes pulseRing { 0% { transform: scale(1); opacity: 1; border-width: 2.5px; } 100% { transform: scale(1.5); opacity: 0; border-width: 0.5px; } }

        /* 3. Text */
        .hero .sub { font-size: 1.15rem; max-width: 560px; color: var(--muted); font-weight: 400; line-height: 1.6; }
        .hero .sub strong { color: var(--cyan); font-weight: 700; text-shadow: 0 0 20px rgba(34,211,238,0.4); }

        /* 4. Stats */
        .hero-stats { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
        .hero-stats .stat-item { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: rgba(241,238,252,0.4); }
        .hero-stats .stat-item i { color: var(--magenta); font-size: 0.75rem; text-shadow: 0 0 10px rgba(236,72,153,0.4); }
        .hero-stats .stat-item strong { color: #fff; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; }

        .reveal { opacity: 0; transform: translateY(24px); transition: all 0.7s ease; }
        .reveal.revealed { opacity: 1; transform: translateY(0); }

        @media (max-width: 640px) {
            .btn-primary { width: 100%; padding: 18px 24px; font-size: 1.1rem; }
            .btn-primary-wrapper { width: 100%; }
            .profile-avatar-wrapper { width: 120px; height: 120px; }
            .hero-stats { gap: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="bg-canvas">
    <div class="grid"></div>
    <div class="orb"></div><div class="orb"></div><div class="orb"></div>
</div>
<canvas id="particleCanvas"></canvas>

<div class="hero-outer">
<section class="hero">

    <!-- 1. Profile photo -->
    <div class="profile-avatar-wrapper reveal">
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
        <div class="avatar-particle"></div>
        <div class="avatar-particle"></div>
        <div class="avatar-particle"></div>
        <div class="profile-photo">
            <img src="divagamer.jpg" alt="Profile" />
        </div>
    </div>

    <!-- 2. Channel name -->
    <h1 class="channel-name reveal">
        <span class="half-a">RAM</span><span class="join-x">x</span><span class="half-b">YAARWIN</span>
    </h1>

    <!-- 3. Button -->
    <span class="btn-primary-wrapper reveal">
        <span class="pulse-ring"></span><span class="pulse-ring"></span><span class="pulse-ring"></span>
        <a href="https://t.me/+5hOKGysSI05lMTg1" target="_blank" class="btn-primary" id="joinHeroBtn">
            <i class="fa-brands fa-telegram"></i> <span>Join RAMxYAARWIN Now</span> <i class="fa-solid fa-arrow-right"></i>
        </a>
    </span>

    <!-- 3. Text -->
    <p class="sub reveal">The <strong>#1</strong> Telegram hub for <strong>AI-powered signals</strong>, exclusive insights, and a next-gen community.</p>

    <!-- 4. 2-3 points -->
    <div class="hero-stats reveal">
        <span class="stat-item"><i class="fa-regular fa-circle-check"></i> <strong>94%</strong> accuracy</span>
        <span class="stat-item"><i class="fa-regular fa-gem"></i> <strong>5K+</strong> members</span>
        <span class="stat-item"><i class="fa-regular fa-clock"></i> <strong>24/7</strong> support</span>
    </div>

</section>
</div>

<script>
    (function() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [], mouseX = -1000, mouseY = -1000, animationId;
        const isMobile = window.innerWidth < 768;
        const particleCount = isMobile ? 30 : 60;
        const connectionDistance = isMobile ? 90 : 140;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', () => { resize(); initParticles(); });

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height;
                this.vx = (Math.random()-0.5)*0.6; this.vy = (Math.random()-0.5)*0.6;
                this.size = Math.random()*2.5+0.8; this.opacity = Math.random()*0.5+0.2;
                const colors = ['rgba(139,92,246,','rgba(34,211,238,','rgba(236,72,153,','rgba(168,85,247,'];
                this.color = colors[Math.floor(Math.random()*colors.length)];
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x<-20) this.x=canvas.width+20; if(this.x>canvas.width+20) this.x=-20;
                if(this.y<-20) this.y=canvas.height+20; if(this.y>canvas.height+20) this.y=-20;
                const dx=this.x-mouseX, dy=this.y-mouseY, dist=Math.sqrt(dx*dx+dy*dy);
                if(dist<180 && dist>0) { const force=(180-dist)/180*0.3; this.vx+=(dx/dist)*force*0.15; this.vy+=(dy/dist)*force*0.15; }
                const speed=Math.sqrt(this.vx*this.vx+this.vy*this.vy), maxSpeed=1.2;
                if(speed>maxSpeed) { this.vx=(this.vx/speed)*maxSpeed; this.vy=(this.vy/speed)*maxSpeed; }
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle=this.color+this.opacity+')'; ctx.fill();
                ctx.beginPath(); ctx.arc(this.x,this.y,this.size*3,0,Math.PI*2); ctx.fillStyle=this.color+(this.opacity*0.15)+')'; ctx.fill();
            }
        }
        function initParticles() { particles=[]; for(let i=0;i<particleCount;i++) particles.push(new Particle()); }
        initParticles();

        function drawConnections() {
            for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++) {
                const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y, dist=Math.sqrt(dx*dx+dy*dy);
                if(dist<connectionDistance) {
                    const alpha=(1-dist/connectionDistance)*0.08;
                    ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y);
                    ctx.strokeStyle='rgba(139,92,246,'+alpha+')'; ctx.lineWidth=0.5; ctx.stroke();
                }
            }
        }
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{ p.update(); p.draw(); }); drawConnections(); animationId=requestAnimationFrame(animate); }
        animate();
        document.addEventListener('mousemove', e=>{ mouseX=e.clientX; mouseY=e.clientY; });
        document.addEventListener('touchmove', e=>{ if(e.touches.length>0){ mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; } }, {passive:true});
        document.addEventListener('visibilitychange', ()=>{ if(document.hidden) cancelAnimationFrame(animationId); else animate(); });
    })();

    (function() {
        const revealEls=document.querySelectorAll('.reveal');
        revealEls.forEach((el,i)=> setTimeout(()=>el.classList.add('revealed'), 120*i));
    })();
</script>
</body>
</html>
