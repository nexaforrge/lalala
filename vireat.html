<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Our Telegram Channel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    background: #0b0e1a;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    max-width: 460px;
    width: 100%;
    background: #12162a;
    border: 3px solid transparent;
    border-radius: 28px;
    background-image: linear-gradient(#12162a, #12162a),
        linear-gradient(135deg, #ff2d95, #2575fc, #ff2d95);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    overflow: hidden;
    animation: cardFade 0.7s ease;
}

@keyframes cardFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.banner-wrapper {
    width: 100%;
    aspect-ratio: 16 / 7;
    position: relative;
}

.banner {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.banner-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);
}

.content {
    padding: 22px 24px 26px;
    text-align: center;
}

.name { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }

.badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: linear-gradient(135deg, #ff2d95, #2575fc);
    color: #fff; font-size: 10px; font-weight: 700; padding: 4px 14px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px;
}

.tagline {
    color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 400;
    margin-top: 12px; line-height: 1.55; padding: 0 4px;
}

.stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin: 18px 0 16px;
}
.stat {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 10px 4px;
}
.stat .num { font-size: 17px; font-weight: 700; color: #fff; }
.stat .num.pink { color: #ff5eb8; }
.stat .num.blue { color: #4fb2ff; }
.stat .label { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }

.divider {
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(255,45,149,0.4), rgba(37,117,252,0.4), transparent);
    margin: 4px 0 18px;
}

.btn-group { display: flex; flex-direction: column; gap: 12px; }

.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; border-radius: 16px; font-weight: 700; text-decoration: none;
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94); letter-spacing: 0.3px;
}
.btn .icon { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
.btn .btn-text { position: relative; z-index: 2; }

.btn .btn-shimmer {
    position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-25deg); transition: left 0.8s ease; z-index: 1;
}
.btn:hover .btn-shimmer { left: 100%; }

.btn-pink {
    background: rgba(255,45,149,0.1);
    color: #ff5eb8;
    border: 2px solid #ff2d95;
    font-size: 17px; padding: 17px 22px;
}
.btn-pink:hover { transform: translateY(-3px); background: rgba(255,45,149,0.18); box-shadow: 0 12px 30px rgba(255,45,149,0.25); }
.btn-pink:active { transform: translateY(0) scale(0.97); }
.btn-pink .icon { animation: pulseIcon 2.2s ease-in-out infinite; }
@keyframes pulseIcon { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.btn-blue {
    background: rgba(37,117,252,0.1);
    color: #4fb2ff;
    border: 2px solid #2575fc;
    font-size: 14px; padding: 13px 22px;
}
.btn-blue:hover { transform: translateY(-3px); background: rgba(37,117,252,0.18); box-shadow: 0 12px 30px rgba(37,117,252,0.25); }
.btn-blue:active { transform: translateY(0) scale(0.97); }

.footer-note {
    color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 16px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.footer-note .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.2); }

@media (max-width: 480px) {
    .content { padding: 18px 16px 20px; }
    .name { font-size: 21px; }
    .btn-pink { font-size: 15px; padding: 15px 18px; }
    .btn-blue { font-size: 13px; padding: 12px 18px; }
    .stat .num { font-size: 15px; }
    .stat .label { font-size: 9px; }
}
</style>
</head>
<body>

<div class="card">

    <div class="banner-wrapper">
        <img class="banner" src="https://via.placeholder.com/800x350" alt="Profile banner" />
        <div class="banner-overlay"></div>
    </div>

    <div class="content">
        <h1 class="name">Study Hub Academy</h1>
        <span class="badge">✦ Education & Learning</span>
        <p class="tagline">Free notes, exam tips, live doubt sessions and study plans — everything a student needs, in one place.</p>

        <div class="stats">
            <div class="stat"><div class="num pink">18.5K</div><div class="label">Students</div></div>
            <div class="stat"><div class="num">4.9<span style="font-size:12px">★</span></div><div class="label">Rating</div></div>
            <div class="stat"><div class="num blue">120+</div><div class="label">Resources</div></div>
        </div>

        <div class="divider"></div>

        <div class="btn-group">

            <a href="https://t.me/yourchannel" class="btn btn-pink" target="_blank" rel="noopener">
                <span class="btn-shimmer"></span>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M21.94 4.36a1.5 1.5 0 0 0-1.66-.2L2.7 11.6a1.4 1.4 0 0 0 .1 2.6l4.5 1.5 1.7 5.4a1.3 1.3 0 0 0 2.2.5l2.4-2.6 4.6 3.4a1.4 1.4 0 0 0 2.2-.9l3-15a1.5 1.5 0 0 0-.66-1.15zM9 14.5l8.6-6.9-9.9 7.5-1.9-.6 9.4-6.9-6.2 6.9v.9z"/>
                </svg>
                <span class="btn-text">JOIN TELEGRAM NOW</span>
            </a>

            <a href="https://t.me/yourchannel" class="btn btn-blue" target="_blank" rel="noopener">
                <span class="btn-shimmer"></span>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                </svg>
                <span class="btn-text">Preview Channel</span>
            </a>

        </div>

        <p class="footer-note">
            <span class="dot"></span>
            No spam · Unsubscribe anytime
            <span class="dot"></span>
        </p>

    </div>

</div>

</body>
</html>
