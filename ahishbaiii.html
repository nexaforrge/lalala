<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Study Hub Academy - Telegram</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #0a0e1f;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(37, 117, 252, 0.08) 0%, transparent 50%),
                #0a0e1f;
        }

        /* ─── CARD ─── */
        .card {
            max-width: 460px;
            width: 100%;
            background: #10152c;
            border-radius: 28px;
            border: 1px solid transparent;
            background-image: linear-gradient(#10152c, #10152c),
                linear-gradient(135deg, #7c3aed 0%, #2575fc 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            overflow: hidden;
            animation: cardFade 0.6s ease;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── BANNER ─── */
        .banner-wrapper {
            width: 100%;
            aspect-ratio: 16 / 7;
            position: relative;
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(10, 14, 31, 0.85) 100%);
        }

        /* ─── CONTENT ─── */
        .content {
            padding: 26px 26px 28px;
            text-align: center;
        }

        .name {
            font-family: 'Poppins', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #ffffff;
            line-height: 1.25;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.35);
            color: #b794f6;
            margin-top: 12px;
        }

        .tagline {
            font-size: 14.5px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 14px;
            padding: 0 4px;
        }

        /* ─── STATS ─── */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 22px 0 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 12px 6px;
        }

        .stat .num {
            font-family: 'Poppins', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
        }

        .stat .num.purple { color: #a78bfa; }
        .stat .num.blue { color: #60a5fa; }
        .stat .num.gold { color: #fbbf24; }

        .stat .label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 3px;
        }

        /* ─── DIVIDER ─── */
        .divider {
            height: 1px;
            margin: 4px 0 20px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
        }

        /* ─── PRIMARY BUTTON ─── */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 17px 24px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.2px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: none;
            background: linear-gradient(135deg, #7c3aed 0%, #2575fc 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.35);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .btn-primary .icon {
            width: 21px;
            height: 21px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-primary .btn-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.85s ease;
        }

        .btn-primary:hover .btn-shimmer { left: 100%; }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(124, 58, 237, 0.45);
        }

        .btn-primary:active { transform: scale(0.97); }

        /* ─── SECONDARY BUTTON ─── */
        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 22px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 13.5px;
            text-decoration: none;
            margin-top: 10px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .btn-secondary .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
            opacity: 0.7;
        }

        /* ─── FOOTER ─── */
        .footer-note {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-note .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            .content { padding: 20px 18px 22px; }
            .name { font-size: 22px; }
            .tagline { font-size: 13.5px; }
            .btn-primary { font-size: 15px; padding: 15px 18px; }
            .btn-secondary { font-size: 13px; padding: 12px 18px; }
            .stat .num { font-size: 16px; }
            .stat .label { font-size: 9px; }
        }

        @media (min-width: 768px) {
            .card { max-width: 500px; border-radius: 32px; }
            .name { font-size: 30px; }
            .tagline { font-size: 15.5px; }
            .btn-primary { font-size: 17px; padding: 19px 26px; }
            .stat .num { font-size: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">

        <div class="banner-wrapper">
            <img class="banner"
            src="https://images.unsplash.com/photo-1523050854058-8df90110c7f1?w=800&h=350&fit=crop&crop=center&auto=format"
            alt="Study Hub Academy banner"
            loading="lazy" />
            <div class="banner-overlay"></div>
        </div>

        <div class="content">

            <h1 class="name">Study Hub Academy</h1>

            <span class="badge">✦ Education & Learning</span>

            <p class="tagline">Free notes, exam tips, live doubt sessions and study plans — everything a student needs, in one place.</p>

            <div class="stats">
                <div class="stat">
                    <div class="num purple">18.5K</div>
                    <div class="label">Students</div>
                </div>
                <div class="stat">
                    <div class="num gold">4.9★</div>
                    <div class="label">Rating</div>
                </div>
                <div class="stat">
                    <div class="num blue">120+</div>
                    <div class="label">Resources</div>
                </div>
            </div>

            <div class="divider"></div>

            <a href="https://t.me/yourchannel" class="btn-primary" target="_blank" rel="noopener">
                <span class="btn-shimmer"></span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.94 4.36a1.5 1.5 0 0 0-1.66-.2L2.7 11.6a1.4 1.4 0 0 0 .1 2.6l4.5 1.5 1.7 5.4a1.3 1.3 0 0 0 2.2.5l2.4-2.6 4.6 3.4a1.4 1.4 0 0 0 2.2-.9l3-15a1.5 1.5 0 0 0-.66-1.15zM9 14.5l8.6-6.9-9.9 7.5-1.9-.6 9.4-6.9-6.2 6.9v.9z"/>
                </svg>
                Join Telegram Now
            </a>

            <a href="https://t.me/yourchannel" class="btn-secondary" target="_blank" rel="noopener">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                </svg>
                Preview channel
            </a>

            <p class="footer-note">
                <span class="dot"></span>
                No spam · Unsubscribe anytime
                <span class="dot"></span>
            </p>

        </div>

    </div>

</body>
</html>
