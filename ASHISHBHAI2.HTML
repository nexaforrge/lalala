<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Study Hub Academy - Telegram</title>

    <!-- ===== PREMIUM FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #080b1a;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: radial-gradient(ellipse at 20% 30%, rgba(255, 45, 149, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(37, 117, 252, 0.06) 0%, transparent 50%),
                #080b1a;
        }

        /* ─── CARD ─── */
        .card {
            max-width: 520px;
            width: 100%;
            background: #0f1329;
            border-radius: 36px;
            border: 2px solid transparent;
            background-image: linear-gradient(#0f1329, #0f1329),
                linear-gradient(135deg, #ff2d95, #2575fc, #f7971e, #ff2d95);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            overflow: hidden;
            animation: cardFade 0.7s ease;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        }

        @keyframes cardFade {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ─── BANNER ─── */
        .banner-wrapper {
            width: 100%;
            aspect-ratio: 16 / 7;
            position: relative;
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .banner:hover {
            transform: scale(1.02);
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 35%, rgba(0, 0, 0, 0.65) 100%);
        }

        /* ─── CONTENT ─── */
        .content {
            padding: 30px 30px 32px;
            text-align: center;
        }

        /* ===== PREMIUM TYPOGRAPHY ===== */
        .name {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c8d6e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 20px rgba(255, 255, 255, 0.08);
            line-height: 1.2;
        }

        /* ===== TOP BUTTON (ENHANCED - BIGGER) ===== */
        .btn-top-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: auto;
            min-width: 220px;
            padding: 16px 44px;
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-radius: 60px;
            margin-top: 16px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #ff2d95 0%, #ff5eb8 30%, #7c3aed 70%, #2575fc 100%);
            background-size: 200% 200%;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 32px rgba(255, 45, 149, 0.45), 0 0 60px rgba(255, 45, 149, 0.15);
            animation: gradientShift 4s ease-in-out infinite;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .btn-top-cta .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            flex-shrink: 0;
            animation: pulseIcon 2.4s ease-in-out infinite;
        }

        .btn-top-cta .btn-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-25deg);
            transition: left 0.85s ease;
            z-index: 1;
            pointer-events: none;
        }

        .btn-top-cta:hover .btn-shimmer {
            left: 100%;
        }

        .btn-top-cta:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 10px 44px rgba(255, 45, 149, 0.6), 0 0 80px rgba(255, 45, 149, 0.2);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-top-cta:active {
            transform: scale(0.96) !important;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 6px 20px;
            border-radius: 100px;
            background: linear-gradient(135deg, #ff2d95, #ff5eb8);
            color: #fff;
            margin-top: 14px;
            box-shadow: 0 4px 20px rgba(255, 45, 149, 0.3);
        }

        .badge .sparkle {
            font-size: 13px;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.2) rotate(10deg);
            }
        }

        /* ─── STATS ─── */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 22px 0 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 16px 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .stat:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .stat .num {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .stat .num.pink {
            background: linear-gradient(135deg, #ff5eb8, #ff2d95);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat .num.blue {
            background: linear-gradient(135deg, #4fb2ff, #2575fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat .num.gold {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat .num .small-star {
            font-size: 14px;
            -webkit-text-fill-color: initial;
            color: #f7971e;
        }

        .stat .label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
        }

        /* ─── DIVIDER ─── */
        .divider {
            height: 2px;
            border-radius: 4px;
            margin: 8px 0 22px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 45, 149, 0.35) 20%,
                    rgba(37, 117, 252, 0.35) 50%,
                    rgba(247, 151, 30, 0.35) 80%,
                    transparent);
        }

        /* ─── BOTTOM SINGLE BUTTON (PRIMARY - BIGGER) ─── */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 22px 28px;
            border-radius: 20px;
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 700;
            font-size: 19px;
            letter-spacing: 0.6px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: none;
            outline: none;
            background: linear-gradient(135deg, #ff2d95 0%, #ff5eb8 30%, #7c3aed 70%, #2575fc 100%);
            background-size: 200% 200%;
            color: #fff;
            box-shadow: 0 10px 38px rgba(255, 45, 149, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            animation: gradientShift 4s ease-in-out infinite;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary .icon {
            width: 26px;
            height: 26px;
            fill: currentColor;
            flex-shrink: 0;
            animation: pulseIcon 2.4s ease-in-out infinite;
        }

        .btn-primary .btn-text {
            position: relative;
            z-index: 2;
            font-size: inherit;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .btn-primary .btn-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.85s ease;
            z-index: 1;
            pointer-events: none;
        }

        .btn-primary:hover .btn-shimmer {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 18px 54px rgba(255, 45, 149, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.08) inset;
        }

        .btn-primary:active {
            transform: scale(0.96) !important;
            transition-duration: 0.08s;
        }

        /* ─── FOOTER ─── */
        .footer-note {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }

        .footer-note .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: inline-block;
        }

        .footer-note .lock-icon {
            opacity: 0.4;
            font-size: 11px;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 520px) {
            .card {
                max-width: 100%;
                border-radius: 28px;
            }

            .content {
                padding: 22px 20px 24px;
            }

            .name {
                font-size: 26px;
            }

            .btn-top-cta {
                padding: 14px 32px;
                font-size: 15px;
                gap: 10px;
                min-width: 180px;
                width: 100%;
            }
            .btn-top-cta .icon {
                width: 20px;
                height: 20px;
            }

            .stats {
                gap: 8px;
                margin: 16px 0 16px;
            }

            .stat {
                padding: 12px 4px;
                border-radius: 14px;
            }

            .stat .num {
                font-size: 18px;
            }

            .stat .label {
                font-size: 9px;
            }

            .btn-primary {
                font-size: 16px;
                padding: 18px 20px;
                border-radius: 16px;
                gap: 10px;
            }

            .btn-primary .icon {
                width: 22px;
                height: 22px;
            }

            .divider {
                margin: 4px 0 18px;
            }

            .badge {
                font-size: 10px;
                padding: 5px 16px;
                margin-top: 12px;
            }

            .footer-note {
                font-size: 11px;
                margin-top: 16px;
            }
        }

        @media (max-width: 400px) {
            .content {
                padding: 16px 14px 18px;
            }

            .name {
                font-size: 22px;
            }

            .btn-top-cta {
                padding: 12px 20px;
                font-size: 13px;
                gap: 8px;
                min-width: 140px;
                border-radius: 50px;
            }
            .btn-top-cta .icon {
                width: 18px;
                height: 18px;
            }

            .stats {
                gap: 5px;
                margin: 12px 0 12px;
            }

            .stat {
                padding: 10px 2px;
                border-radius: 12px;
            }

            .stat .num {
                font-size: 15px;
            }

            .stat .label {
                font-size: 8px;
            }

            .btn-primary {
                font-size: 14px;
                padding: 15px 14px;
                border-radius: 14px;
                gap: 8px;
            }

            .btn-primary .icon {
                width: 19px;
                height: 19px;
            }

            .badge {
                font-size: 8px;
                padding: 4px 12px;
                margin-top: 10px;
            }

            .divider {
                margin: 2px 0 14px;
            }

            .footer-note {
                font-size: 10px;
                margin-top: 14px;
            }
        }

        @media (min-width: 768px) {
            .card {
                max-width: 560px;
                border-radius: 40px;
            }

            .content {
                padding: 36px 40px 38px;
            }

            .name {
                font-size: 38px;
            }

            .btn-top-cta {
                font-size: 18px;
                padding: 18px 50px;
                min-width: 260px;
                gap: 16px;
            }
            .btn-top-cta .icon {
                width: 26px;
                height: 26px;
            }

            .btn-primary {
                font-size: 20px;
                padding: 24px 32px;
                border-radius: 22px;
                gap: 16px;
            }

            .btn-primary .icon {
                width: 28px;
                height: 28px;
            }

            .stat .num {
                font-size: 24px;
            }

            .stat .label {
                font-size: 12px;
            }

            .badge {
                font-size: 12px;
                padding: 7px 24px;
                margin-top: 16px;
            }

            .stats {
                gap: 14px;
                margin: 24px 0 22px;
            }

            .stat {
                padding: 18px 10px;
                border-radius: 20px;
            }

            .divider {
                margin: 10px 0 24px;
            }
        }

        /* ─── DARK MODE FALLBACK ─── */
        @media (prefers-color-scheme: light) {
            .card {
                background: #1a1f3a;
                background-image: linear-gradient(#1a1f3a, #1a1f3a),
                    linear-gradient(135deg, #ff2d95, #2575fc, #f7971e, #ff2d95);
            }
            .name {
                background: linear-gradient(135deg, #ffffff 0%, #e0e7f0 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .stat {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        /* ─── REDUCE MOTION ─── */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .btn .btn-shimmer {
                display: none;
            }
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== BANNER ===== -->
        <div class="banner-wrapper">
            <img class="banner"
            src="https://images.unsplash.com/photo-1523050854058-8df90110c7f1?w=800&h=350&fit=crop&crop=center&auto=format"
            alt="Study Hub Academy banner"
            loading="lazy" />
            <div class="banner-overlay"></div>
        </div>

        <!-- ===== CONTENT ===== -->
        <div class="content">

            <!-- Title -->
            <h1 class="name">Study Hub Academy</h1>

            <!-- ===== TOP BUTTON (ENHANCED - BIGGER) ===== -->
            <a href="https://t.me/yourchannel" class="btn-top-cta" target="_blank" rel="noopener">
                <span class="btn-shimmer"></span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.94 4.36a1.5 1.5 0 0 0-1.66-.2L2.7 11.6a1.4 1.4 0 0 0 .1 2.6l4.5 1.5 1.7 5.4a1.3 1.3 0 0 0 2.2.5l2.4-2.6 4.6 3.4a1.4 1.4 0 0 0 2.2-.9l3-15a1.5 1.5 0 0 0-.66-1.15zM9 14.5l8.6-6.9-9.9 7.5-1.9-.6 9.4-6.9-6.2 6.9v.9z"/>
                </svg>
                <span class="btn-text">JOIN CHANNEL NOW</span>
            </a>

            <!-- Badge -->
            <span class="badge">
                <span class="sparkle">✦</span> Education &amp; Learning
            </span>

            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="num pink">18.5K</div>
                    <div class="label">Students</div>
                </div>
                <div class="stat">
                    <div class="num gold">4.9<span class="small-star">★</span></div>
                    <div class="label">Rating</div>
                </div>
                <div class="stat">
                    <div class="num blue">120+</div>
                    <div class="label">Resources</div>
                </div>
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- ===== SINGLE BOTTOM BUTTON ===== -->
            <a href="https://t.me/yourchannel" class="btn-primary" target="_blank" rel="noopener">
                <span class="btn-shimmer"></span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.94 4.36a1.5 1.5 0 0 0-1.66-.2L2.7 11.6a1.4 1.4 0 0 0 .1 2.6l4.5 1.5 1.7 5.4a1.3 1.3 0 0 0 2.2.5l2.4-2.6 4.6 3.4a1.4 1.4 0 0 0 2.2-.9l3-15a1.5 1.5 0 0 0-.66-1.15zM9 14.5l8.6-6.9-9.9 7.5-1.9-.6 9.4-6.9-6.2 6.9v.9z"/>
                </svg>
                <span class="btn-text">JOIN CHANNEL NOW</span>
            </a>

            <!-- Footer -->
            <p class="footer-note">
                <span class="dot"></span>
                No spam · Unsubscribe anytime
                <span class="dot"></span>
                <span class="lock-icon">🔒</span>
            </p>

        </div>

    </div>

</body>
</html>
