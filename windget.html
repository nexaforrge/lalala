<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Widget</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

/* 🌐 WEBSITE */
iframe {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* 🔵 FLOATING BUTTON */
.floating-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: linear-gradient(45deg, #00ff88, #00ccff);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  color: black;
  cursor: pointer;
  z-index: 9999;
  box-shadow: 0 0 15px #00ff88;
}

/* 🔥 OVERLAY */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9998;
}

/* ✨ GLOW */
@keyframes glow {
  0% { box-shadow: 0 0 10px #00ff88; }
  50% { box-shadow: 0 0 30px #00ff88; }
  100% { box-shadow: 0 0 10px #00ff88; }
}

/* 🧩 WIDGET */
.widget {
  width: 320px;
  background: black;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  border: 2px solid #00ff88;
  animation: glow 1.5s infinite;
  position: relative;
}

/* ❌ CLOSE */
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* TEXT */
.title {
  color: #00ff88;
  font-size: 18px;
}

.sub {
  color: #00ff88;
  margin: 10px 0;
}

/* BUTTONS */
.btn {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.red {
  background: red;
  color: white;
}

.blue {
  background: #007bff;
  color: white;
}

/* LOADER */
.loader {
  width: 100%;
  height: 6px;
  background: #222;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

.progress {
  width: 0%;
  height: 100%;
  background: #00ff88;
}

/* LATENCY */
.latency {
  color: #00ff88;
  font-size: 12px;
  margin-top: 10px;
}
</style>

</head>
<body>

<!-- 🌐 WEBSITE -->
<iframe src="https://www.jaiclub22.com/#/register?invitationCode=86113103038"></iframe>

<!-- 🔵 FLOAT BUTTON -->
<div class="floating-btn" onclick="openWidget()">⚡</div>

<!-- 🔥 OVERLAY -->
<div class="overlay" id="overlay">

  <div class="widget">
    <div class="close" onclick="closeWidget()">✖</div>

    <div class="title">BS STORE PYTHON</div>
    <div class="sub">VIP ACTIVE ₹500</div>

    <p style="color:white;">System Ready</p>

    <button class="btn red" onclick="startHack()">⚡ START HACK</button>
    <button class="btn blue" onclick="startHack()">START NUMBER</button>

    <div class="loader">
      <div class="progress" id="progress"></div>
    </div>

    <div class="latency">Server Latency: 24ms</div>
  </div>

</div>

<script>
function openWidget() {
  document.getElementById("overlay").style.display = "flex";
}

function closeWidget() {
  document.getElementById("overlay").style.display = "none";
}

function startHack() {
  let progress = document.getElementById("progress");
  let width = 0;

  let interval = setInterval(() => {
    if (width >= 100) {
      clearInterval(interval);
      alert("SUCCESS ✅");
    } else {
      width++;
      progress.style.width = width + "%";
    }
  }, 25);
}
</script>

</body>
</html>
