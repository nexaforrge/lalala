<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel Landing Page</title>

<!-- Icons (Font Awesome) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .box {
        background: #111827;
        padding: 30px;
        border-radius: 16px;
        width: 320px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.08);
    }

    /* Channel Name */
    .channel-name {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 20px;
        letter-spacing: 1px;
    }

    /* Profile Image (Clean Circle, No Glow) */
    .profile img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #1f2937;
        margin-bottom: 20px;
    }

    /* Heading */
    .tagline {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 5px;
    }

    /* Small text */
    .subtext {
        font-size: 12px;
        color: #9ca3af;
        margin-bottom: 25px;
    }

    /* Button */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
    }

    .btn:hover {
        background: #1d4ed8;
    }

    /* Footer */
    .footer {
        margin-top: 20px;
        font-size: 13px;
        color: #9ca3af;
    }

    .footer a {
        color: #60a5fa;
        text-decoration: none;
        font-weight: 500;
    }

    .footer a:hover {
        text-decoration: underline;
    }

</style>
</head>

<body>

<div class="box">

    <!-- Channel Name -->
    <div class="channel-name">YOUR CHANNEL NAME</div>

    <!-- Profile -->
    <div class="profile">
        <img src="https://via.placeholder.com/150" alt="Profile">
    </div>

    <!-- Tagline -->
    <div class="tagline">Most Demanding Channel</div>
    <div class="subtext">100% Safe and Secure</div>

    <!-- Button -->
    <a href="https://t.me/yourchannel" class="btn">
        <i class="fa-solid fa-paper-plane"></i> Join Now
    </a>

    <!-- Footer -->
    <div class="footer">
        Ads managed by 
        <a href="https://your-link.com" target="_blank">GBM</a>
    </div>

</div>

</body>
</html>
