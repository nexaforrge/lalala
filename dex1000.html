<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="RAMxYAARWIN – #1 Telegram Hub" />
    <meta property="og:description" content="Join the most trusted prediction channel — real-time signals, AI-powered insight, one squad." />
    <meta property="og:image" content="divagamer.jpg" />
    <meta property="og:url" content="https://rawats7.github.io/divagame.org/" />
    <meta property="og:type" content="website" />
    <meta name="description" content="RAMxYAARWIN — the #1 Telegram hub for crypto signals, AI alerts, and a next-gen community." />
    <title>RAMxYAARWIN – #1 Telegram Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        :root {
            --bg: #0A0A0A;
            --mint: #00FFAA;
            --pink: #FF007F;
            --purple: #7B2FFF;
            --ink: #ffffff;
            --muted: rgba(255,255,255,0.7);
            --glass-border: rgba(0, 255, 170, 0.4);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Liquid wave canvas */
        #waveCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }
        .orb.pink {
            width: 500px; height: 500px;
            background: rgba(255, 0, 127, 0.25);
            top: -15%; left: -10%;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }
        .orb.mint {
            width: 400px; height: 400px;
            background: rgba(0, 255, 170, 0.2);
            bottom: -15%; right: -10%;
            animation: orbFloat 22s ease-in-out infinite alternate-reverse;
        }
        @keyframes orbFloat {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.15); }
        }

        /* Card – transparent with neon border */
        .card {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 440px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 44px 28px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.15), 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 50px rgba(0, 255, 170, 0.3), 0 30px 60px rgba(0,0,0,0.8);
        }

        /* Profile photo – dual rotating rings */
        .profile-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
        }
        .ring-glow {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(from 0deg, var(--mint), var(--pink), var(--purple), var(--mint)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spin 7s linear infinite;
        }
        .ring-dash {
            position: absolute;
            inset: -16px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.4);
            animation: spinReverse 11s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spinReverse { to { transform: rotate(-360deg); } }
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            z-index: 2;
            border: 3px solid rgba(0,0,0,0.6);
            box-shadow: 0 0 35px rgba(0, 255, 170, 0.6), 0 0 20px rgba(255, 0, 127, 0.4);
            animation: picPulse 3s ease-in-out infinite;
        }
        @keyframes picPulse {
            0%,100% { box-shadow: 0 0 35px rgba(0, 255, 170, 0.6), 0 0 20px rgba(255, 0, 127, 0.4); }
            50% { box-shadow: 0 0 55px rgba(123, 47, 255, 0.8), 0 0 30px rgba(0, 255, 170, 0.6); }
        }
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Channel name */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 8vw, 2.8rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--mint), var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(0, 255, 170, 0.35));
            line-height: 1.1;
            animation: fadeUp 0.8s 0.2s both ease-out;
        }

        /* Button – vibrant gradient + shine + pulse */
        .btn-join {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            background: linear-gradient(135deg, var(--mint), var(--pink));
            color: #0A0A0A;
            font-weight: 800;
            font-size: 1.25rem;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            padding: 20px 30px;
            border-radius: 60px;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.5);
            transition: all 0.3s ease;
            animation: fadeUp 0.8s 0.4s both ease-out, btnPulse 2.5s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes btnPulse {
            0%,100% { box-shadow: 0 0 30px rgba(0, 255, 170, 0.5); }
            50% { box-shadow: 0 0 50px rgba(255, 0, 127, 0.7), 0 0 30px rgba(123, 47, 255, 0.5); }
        }
        .btn-join::after {
            content: "";
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0% { left: -75%; }
            20% { left: 120%; }
            100% { left: 120%; }
        }
        .btn-join:hover {
            background: linear-gradient(135deg, var(--purple), var(--mint));
            box-shadow: 0 0 60px rgba(0, 255, 170, 0.8);
            transform: translateY(-4px) scale(1.03);
        }
        .btn-join:active {
            transform: scale(0.98);
        }
        .btn-join i {
            font-size: 1.2rem;
        }

        /* Tagline */
        .tagline {
            font-size: 1.05rem;
            color: var(--muted);
            line-height: 1.7;
            max-width: 350px;
            font-weight: 500;
            text-shadow: 0 1px 15px rgba(0,0,0,0.8);
            animation: fadeUp 0.8s 0.6s both ease-out;
        }
        .tagline strong {
            color: var(--mint);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        /* Stats */
        .stats {
            display: flex;
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 170, 0.2);
            animation: fadeUp 0.8s 0.8s both ease-out;
        }
        .stat {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 6px;
            border-right: 1px solid rgba(255,255,255,0.08);
        }
        .stat:last-child {
            border-right: none;
        }
        .stat .label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }
        .stat .value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--mint);
            text-shadow: 0 0 10px var(--mint);
        }
        .stat .value.pink {
            color: var(--pink);
            text-shadow: 0 0 10px var(--pink);
        }

        /* Fade up */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .card {
                padding: 30px 18px;
                border-radius: 22px;
            }
            h1 {
                font-size: 2rem;
            }
            .btn-join {
                font-size: 1.1rem;
                padding: 16px 22px;
            }
        }
    </style>
</head>
<body>

<div class="orb pink"></div>
<div class="orb mint"></div>
<canvas id="waveCanvas"></canvas>

<div class="card">
    <!-- Profile -->
    <div class="profile-wrapper">
        <div class="ring-glow"></div>
        <div class="ring-dash"></div>
        <div class="profile-pic">
            <img src="divagamer.jpg" alt="Profile" />
        </div>
    </div>

    <!-- Name -->
    <h1>RAMxYAARWIN</h1>

    <!-- Button -->
    <a href="https://t.me/+5hOKGysSI05lMTg1" target="_blank" class="btn-join">
        <i class="fa-brands fa-telegram"></i> Join Channel Now
    </a>

    <!-- Description -->
    <p class="tagline">
        The <strong>#1</strong> Telegram hub for <strong>AI‑powered signals</strong>, exclusive insight, and a next‑gen community.
    </p>

    <!-- Stats -->
    <div class="stats">
        <div class="stat">
            <span class="label">Accuracy</span>
            <span class="value">94.2%</span>
        </div>
        <div class="stat">
            <span class="label">Members</span>
            <span class="value pink">5,000+</span>
        </div>
        <div class="stat">
            <span class="label">Uptime</span>
            <span class="value" style="color:#fff;">24/7</span>
        </div>
    </div>
</div>

<script>
    // ---------- LIQUID WAVE PARTICLE BACKGROUND ----------
    (function() {
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [], animationId;
        const NUM = 80;
        const COLORS = ['rgba(0,255,170,', 'rgba(255,0,127,', 'rgba(123,47,255,'];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class WaveParticle {
            constructor() {
                this.reset();
            }
            reset() {
                // Random starting position
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Wave parameters
                this.amplitude = 30 + Math.random() * 60;
                this.period = 0.005 + Math.random() * 0.015;
                this.speed = 0.015 + Math.random() * 0.03;
                this.phase = Math.random() * Math.PI * 2;
                this.verticalShift = 0.3 + Math.random() * 0.7;
                this.size = 1.8 + Math.random() * 2.5;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.opacity = 0.4 + Math.random() * 0.5;
            }
            update(time) {
                // Move in a wave: x stays within screen, y oscillates vertically
                this.y += this.verticalShift * 0.5;
                if (this.y > canvas.height + 20) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
                // Horizontal wave motion
                this.x += Math.sin(time * this.speed + this.phase) * 0.5;
                if (this.x < -20) this.x = canvas.width + 20;
                if (this.x > canvas.width + 20) this.x = -20;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fillStyle = this.color + this.opacity + ')';
                ctx.shadowColor = this.color + '0.8)';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < NUM; i++) {
                particles.push(new WaveParticle());
            }
        }

        resize();
        window.addEventListener('resize', () => { resize(); init(); });
        init();

        function drawConnections() {
            const maxDist = 130;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i+1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    if (dist < maxDist) {
                        const alpha = (1 - dist/maxDist) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = 'rgba(0,255,170,' + alpha + ')';
                        ctx.lineWidth = 0.7;
                        ctx.stroke();
                    }
                }
            }
        }

        let then = Date.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now();
            const time = now * 0.001;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update(time);
                p.draw();
            });
            drawConnections();
        }
        animationId = requestAnimationFrame(animate);
    })();
</script>

</body>
</html>
